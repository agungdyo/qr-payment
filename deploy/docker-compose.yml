# Docker Compose production qr-payment.
#
#   cd deploy
#   set -a; . /opt/qr-payment/.env; set +a      # PUBLIC_ORIGIN dibaca dari sini
#   docker compose up -d --build
#
# Hanya service `web` yang mengekspos port ke luar (8091). `api` tidak dipublish,
# jadi backend dan database tidak bisa dihubungi langsung dari internet.
#
# Database TIDAK ada di sini: production memakai PostgreSQL eksternal, alamatnya
# dari DATABASE_HOST/PORT/NAME/USER/PASSWORD (atau DATABASE_URL) di /opt/qr-payment/.env.

name: qr-payment

services:
  api:
    image: qrpay-v-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - /opt/qr-payment/.env
    environment:
      PORT: 3000
      TZ: Asia/Jakarta
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  waf:
    image: owasp/modsecurity-crs:4-nginx-alpine-lts
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: 8080
      BACKEND: http://api:3000
      PROXY: 1
      PROXY_SSL: "off"
      SERVER_NAME: localhost
      MODSEC_RULE_ENGINE: "on"
      BLOCKING_PARANOIA: 1
      ANOMALY_INBOUND: 5
      ANOMALY_OUTBOUND: 4
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT DELETE"
      MODSEC_REQ_BODY_LIMIT: "26214400"
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_PARTS: "ABIJDEFHZ"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
    volumes:
      - ./waf/modsecurity-override.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    image: qrpay-v-frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Wajib diisi: frontend memakai nilai ini untuk memilih backend sungguhan.
        # Kosong = bundle berjalan di mode demo (data palsu), jadi sengaja
        # dibiarkan gagal di sini alih-alih diam-diam menghasilkan image yang salah.
        VITE_API_BASE_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN belum diisi. Jalankan "set -a; . /opt/qr-payment/.env; set +a" lebih dulu.}
    restart: unless-stopped
    ports:
      - "8091:80"
    environment:
      API_UPSTREAM: http://waf:8080
    depends_on:
      waf:
        condition: service_healthy
